<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>КЛСД Магазин</title>
<script src="telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Pangolin&family=Unbounded:wght@500;700&display=swap&subset=cyrillic">
<style>
/* Layout: one phone-width column (Telegram mini app). Sticky search + category rail, 2-col grid of product lines,
   full-height sheets for a line and for the cart, a bottom cart bar (Telegram MainButton when inside Telegram). */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --ink:#11131B; --muted:#697084; --line:#E1E4EC;
  --accent:#2747EE; --accent-ink:#FFFFFF; --accent-soft:#E6EAFE;
  --tile-s:62%; --tile-l:86%; --tile-ink:#11131B; --shade:rgba(17,19,27,.08); --photo-bg:#FFFFFF; --warm:#E8512F; --ok:#2E9E6A; --bgfx-o:.13; --bgfx-f:none; --glass:rgba(242,243,247,.82);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-s:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --surface:#171A23; --ink:#ECEEF5; --muted:#8B91A5; --line:#262A36;
  --accent:#7088FF; --accent-ink:#0D0F15; --accent-soft:#1F2647;
  --tile-s:34%; --tile-l:24%; --tile-ink:#ECEEF5; --shade:rgba(0,0,0,.35); --photo-bg:#FFFFFF; --warm:#F0603E; --ok:#2F9A68; --bgfx-o:.15; --bgfx-f:invert(1); --glass:rgba(13,15,21,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --surface:#171A23; --ink:#ECEEF5; --muted:#8B91A5; --line:#262A36;
  --accent:#7088FF; --accent-ink:#0D0F15; --accent-soft:#1F2647;
  --tile-s:34%; --tile-l:24%; --tile-ink:#ECEEF5; --shade:rgba(0,0,0,.35); --photo-bg:#FFFFFF; --warm:#F0603E; --ok:#2F9A68; --bgfx-o:.15; --bgfx-f:invert(1); --glass:rgba(13,15,21,.8); color-scheme:dark}
/* Inside Telegram the bot's theme wins */
.tg{--bg:var(--tg-theme-secondary-bg-color,#F2F3F7);--surface:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#11131B);
  --muted:var(--tg-theme-hint-color,#697084);--accent:var(--tg-theme-button-color,#2747EE);--accent-ink:var(--tg-theme-button-text-color,#fff)}

/* анимированные обои: пчёл столбиками по диагонали, едут из правого верхнего угла в левый нижний */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx canvas{position:absolute;inset:0;width:100%;height:100%}
.app{position:relative;z-index:1}
.sheeted .app{visibility:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{display:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:96px}
/* во весь экран: сверху у Telegram свои кнопки — отступаем; на широком экране каталог шире */
html.fs{--fs-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
html.fs body{padding-top:var(--fs-top)}
html.fs body::before{height:var(--fs-top)}
html.fs .top{top:var(--fs-top)}
html.fs .sheet{padding-top:var(--fs-top)}

.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-block:12px 8px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.brandrow .logo{flex:1 1 auto;min-width:0}.brandrow .logo>span{min-width:0}.brandrow .logo .lgimg{flex:none}
.brandrow .logo small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandrow .iconbtn{flex:none}
.lgimg{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 2px #FFE3EF}
.lgt{display:block;font-family:Pangolin,var(--f-body);font-size:24px;line-height:1}
.logo>span{text-align:left;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:5px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-s);padding:0 12px;height:44px;border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.search input::placeholder{color:var(--muted)}
.clear{color:var(--muted);font-size:20px;width:28px;height:28px;line-height:1}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:12px 4px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.rail{cursor:grab;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 28px),transparent)}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip b{font-weight:600;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.6}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.bar h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px;text-wrap:balance}
.bar select{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:4px 0;max-width:150px}
.sels{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bar #wh{color:var(--accent);font-weight:700}
.bar h2{min-width:0}

/* grid of lines */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid{gap:12px}}
.card{position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 250px;transition:transform .12s}
.card:active{transform:scale(.98)}
.tile{position:relative;aspect-ratio:1/0.82;max-width:100%;background:hsl(var(--h) var(--tile-s) var(--tile-l));color:var(--tile-ink);overflow:hidden}
.tile.photo{background:var(--photo-bg)}
.tile.photo img{position:absolute;left:8%;top:10%;width:84%;height:84%;object-fit:contain}
.hero.photo img{top:6%;height:88%}
.th{flex:none;width:46px;height:46px;border-radius:10px;background:var(--photo-bg);object-fit:contain;padding:3px}
.th.blank{background:hsl(var(--h) var(--tile-s) var(--tile-l))}
.th.add{background:var(--accent-soft)}
.tile .mono{position:absolute;left:12px;bottom:6px;font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;opacity:.9}
.tile .mono.long{font-size:32px}
.tile .ring{position:absolute;right:-28%;top:-30%;width:85%;aspect-ratio:1;border-radius:50%;border:14px solid hsl(var(--h) var(--tile-s) calc(var(--tile-l) + 6%));opacity:.9}
.tile .tag{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.tile .tag span{background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .name{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .meta{color:var(--muted);font-size:12px;font-weight:500}
.card .price{margin-top:auto;padding-top:4px;font-family:var(--f-display);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.card .price small{font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}
.card .incart{position:absolute;right:10px;top:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px}

/* главная: баннеры */
.banners{position:relative;margin-top:6px}
.btrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px;cursor:grab}
.btrack::-webkit-scrollbar{display:none}
.banner{flex:0 0 100%;scroll-snap-align:start;min-height:168px;padding:20px 20px 30px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;color:#fff;position:relative;overflow:hidden;user-select:none}
.banner .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.banner .h{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;text-wrap:balance;max-width:20ch}
.banner .p{font-size:14px;line-height:1.35;opacity:.88;max-width:34ch}
.banner.pink{background:#FFE3EF;color:#141414}
.banner.pink .deco{border-color:rgba(255,79,154,.18)}.banner.pink .deco2{background:rgba(255,79,154,.16)}
.lgrow{display:flex;align-items:center;gap:18px}
.decode{font-family:Pangolin,var(--f-body);font-size:17px;color:#141414;opacity:.75;text-align:left;padding:4px 0;cursor:pointer}
.decode:hover{opacity:1}
.lgrow img{width:104px;height:104px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.lgrow b{font-family:Pangolin,var(--f-body);font-weight:400;font-size:64px;line-height:1}
.banner.club{background:#fff;color:#141414;justify-content:center;box-shadow:inset 0 0 0 1px rgba(17,19,27,.06)}
.banner.club .deco,.banner.club .deco2{display:none}
.banner.club .rface{position:absolute;left:calc(100% - 144px);top:-28px;width:243px;height:auto;transform:rotate(-8deg);pointer-events:none;filter:saturate(1.05)}
.banner.club .slogan{position:relative;margin-left:clamp(18px,9%,90px);font-family:Pangolin,var(--f-body);font-weight:400;font-size:31px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em;
  text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff,0 0 7px #fff,0 0 10px rgba(255,255,255,.9)}
.banner.white{background:#fff;color:#141414;box-shadow:inset 0 0 0 1px rgba(17,19,27,.06)}
.banner.white .deco,.banner.white .deco2{display:none}
.banner.white .k{font-family:Pangolin,var(--f-body);font-weight:400;font-size:14px;letter-spacing:.06em;opacity:.55}
.banner.white .h{font-family:Pangolin,var(--f-body);font-weight:400;font-size:27px;line-height:1.08;max-width:18ch}
.banner.white .p{font-family:Pangolin,var(--f-body);font-size:16px;line-height:1.25;opacity:.7}
.banner.cont{padding-left:132px}
.banner.cont .rface{position:absolute;left:-144px;top:-28px;width:243px;transform:rotate(-8deg);pointer-events:none}
.banner.cont .h{font-size:24px}
.banner.cont .p{font-size:14px}
.banner.cont .k{font-size:12px}
.banner.days{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.banner.days .dt{font-family:Pangolin,var(--f-body);font-size:30px;line-height:1.02;text-transform:uppercase;flex:0 1 auto}
.banner.days .ds{font-family:Pangolin,var(--f-body);font-size:14px;opacity:.6;margin-top:8px;text-transform:none;line-height:1.2}
.cal{font-family:Pangolin,var(--f-body);flex:0 0 min(196px,49%);width:min(196px,49%)}
.cal .cm{font-size:15px;text-align:center;margin-bottom:2px;text-transform:lowercase;opacity:.75}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:1px;text-align:center;font-size:13px;line-height:21px}
.cal .cg b{font-weight:400;font-size:11px;opacity:.45}
.cal .cg i{font-style:normal;position:relative}
.cal .cg i.we{opacity:.55}
.cal .cg i.now{text-decoration:underline;text-underline-offset:2px}
.cal .cg i.mon{color:#b88400;font-weight:700;opacity:1}
.cal .blood.g .ring,.cal .blood.g .ring2{stroke:#e8b400}
.cal .blood.g .drip{fill:#e8b400}
.cal .blood.g .ring{filter:drop-shadow(0 .5px 0 rgba(110,70,0,.55))}
.cal .cg i.pink{color:#d6246e;font-weight:700;opacity:1}
.cal .blood.pk .ring,.cal .blood.pk .ring2{stroke:#f0418a}
.cal .blood.pk .drip{fill:#f0418a}
.cal .blood.pk .ring{filter:drop-shadow(0 .5px 0 rgba(120,0,50,.45))}
.cal .cg i.sort{color:#0f7a26;font-weight:700;opacity:1}
.cal .blood.wide{left:-6px;width:calc(200% + 12px);height:36px;transform:translate(0,-52%) rotate(-3deg)}
.cal .blood.gr .ring,.cal .blood.gr .ring2{stroke:#1b8f2f}
.cal .blood.gr .drip{fill:#1b8f2f}
.banner.days .dl{flex:1 1 0;min-width:0}
.banner.days .dt{font-size:clamp(19px,5vw,34px)}
.banner.days .ln{font-family:Pangolin,var(--f-body);font-size:15px;line-height:1.15;margin-top:4px;font-weight:700}
.banner.days .ln.r{color:#a3001a}.banner.days .ln.y{color:#c28e00}.banner.days .ln.g{color:#1b8f2f}.banner.days .ln .ap{font-weight:400;opacity:.75}.banner.days .ln.p{color:#d6246e}
.banner.days .ln:first-of-type{margin-top:10px}
.cal .cg i.hot{color:#9e0012;font-weight:700;opacity:1}
.cal .blood{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-52%) rotate(-12deg);overflow:visible;pointer-events:none}
.cal .blood .ring{fill:none;stroke:#a3001a;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 .5px 0 rgba(90,0,10,.5))}
.cal .blood .drip{fill:#a3001a}
.cal .blood .ring2{fill:none;stroke:#a3001a;stroke-width:2;stroke-linecap:round;opacity:.7}
.cal .blood .shine{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.2;stroke-linecap:round}
@keyframes bglitch{
  0%{transform:translate(-5px,0);clip-path:inset(8% 0 62% 0);filter:drop-shadow(-4px 0 0 rgba(0,229,255,.85)) drop-shadow(4px 0 0 rgba(255,0,140,.75))}
  12%{transform:translate(6px,0);clip-path:inset(55% 0 18% 0);filter:drop-shadow(5px 0 0 rgba(0,229,255,.85)) drop-shadow(-5px 0 0 rgba(255,0,140,.75))}
  24%{transform:translate(-3px,1px);clip-path:inset(0 0 0 0);filter:drop-shadow(-3px 0 0 rgba(0,229,255,.8)) drop-shadow(3px 0 0 rgba(255,0,140,.7))}
  36%{transform:translate(4px,-1px);clip-path:inset(30% 0 40% 0);filter:drop-shadow(4px 0 0 rgba(0,229,255,.8)) drop-shadow(-4px 0 0 rgba(255,0,140,.7))}
  48%{transform:translate(-2px,0);clip-path:inset(0 0 0 0);filter:drop-shadow(-2px 0 0 rgba(0,229,255,.7)) drop-shadow(2px 0 0 rgba(255,0,140,.6))}
  62%{transform:translate(2px,0);clip-path:inset(70% 0 5% 0)}
  74%{transform:none;clip-path:inset(0 0 0 0);filter:drop-shadow(1px 0 0 rgba(0,229,255,.5)) drop-shadow(-1px 0 0 rgba(255,0,140,.4))}
  100%{transform:none;clip-path:inset(0 0 0 0);filter:none}}
@keyframes bglitchbg{0%,100%{transform:none}10%{transform:translateX(-3px) skewX(-2deg)}22%{transform:translateX(4px)}34%{transform:translateX(-2px) skewX(1.5deg)}46%{transform:none}}
@keyframes dotglitch{0%{background:#00e5ff;transform:translateX(-6px) scaleX(1.6)}20%{background:#ff2a6d;transform:translateX(5px) scaleX(.7)}40%{background:#00e5ff;transform:translateX(-3px) scaleX(1.3)}60%{background:#ff2a6d;transform:translateX(2px)}80%{background:#141414;transform:translateX(-1px)}100%{transform:none}}
.dots.gl{animation:bglitch .5s steps(1,end)}
.dots.gl span.on{animation:dotglitch .5s steps(1,end)}
@media (prefers-reduced-motion:reduce){.dots.gl,.dots.gl span.on{animation:none}}
.banner.meowb{align-items:center;justify-content:center;padding:0}
.meow{position:relative;font-family:Pangolin,var(--f-body);font-size:84px;line-height:1;color:#141414;letter-spacing:.02em;animation:meowJ 3.2s steps(1,end) infinite}
.meow::before,.meow::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;opacity:0}
.meow::before{color:#ff2a6d;animation:meowA 3.2s steps(1,end) infinite}
.meow::after{color:#00e5ff;animation:meowB 3.2s steps(1,end) infinite}
@keyframes meowJ{0%,74%,100%{transform:none}76%{transform:translate(-4px,1px) skewX(-6deg)}79%{transform:translate(5px,0)}82%{transform:translate(-2px,-1px) skewX(4deg)}85%{transform:none}90%{transform:translate(3px,0)}92%{transform:none}}
@keyframes meowA{0%,74%,93%,100%{opacity:0;transform:none;clip-path:none}
  75%{opacity:.9;transform:translate(-7px,0);clip-path:inset(10% 0 55% 0)}78%{opacity:.9;transform:translate(6px,0);clip-path:inset(55% 0 10% 0)}
  81%{opacity:.9;transform:translate(-4px,0);clip-path:inset(30% 0 35% 0)}84%{opacity:.8;transform:translate(3px,0);clip-path:inset(0 0 70% 0)}
  89%{opacity:.9;transform:translate(-5px,0);clip-path:inset(62% 0 5% 0)}}
@keyframes meowB{0%,74%,93%,100%{opacity:0;transform:none;clip-path:none}
  75%{opacity:.9;transform:translate(7px,0);clip-path:inset(50% 0 15% 0)}78%{opacity:.9;transform:translate(-6px,0);clip-path:inset(5% 0 60% 0)}
  81%{opacity:.9;transform:translate(4px,0);clip-path:inset(40% 0 25% 0)}84%{opacity:.8;transform:translate(-3px,0);clip-path:inset(72% 0 0 0)}
  89%{opacity:.9;transform:translate(5px,0);clip-path:inset(15% 0 50% 0)}}
@media (prefers-reduced-motion:reduce){.meow,.meow::before,.meow::after{animation:none}}
.banner.status{justify-content:center}
.ost{font-family:Pangolin,var(--f-body);color:#141414;display:flex;flex-direction:column;gap:2px}
.ost .ok{font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.5}
.ost .ot{font-size:23px;line-height:1.1;display:flex;align-items:center;gap:10px}
.ost .ot i{width:12px;height:12px;border-radius:50%;background:var(--oc);flex:0 0 auto;box-shadow:0 0 0 0 var(--oc);animation:ostP 1.8s ease-out infinite}
.ost .ol{font-size:13px;opacity:.55;margin-top:5px}
.ost .oc{font-size:31px;line-height:1;font-variant-numeric:tabular-nums;color:var(--oc)}
.ost .os{font-size:13px;opacity:.65;margin-top:3px}
.ost .ob{font-size:12px;margin-top:5px;padding:3px 8px;border-radius:9px;align-self:flex-start;background:color-mix(in srgb,var(--bc) 12%,#fff);color:var(--bc)}
.ost .ob.y{--bc:#b07f00}.ost .ob.g{--bc:#1b8f2f}.ost .ob.p{--bc:#d6246e}
.ost.r{--oc:#a3001a}.ost.y{--oc:#c28e00}.ost.g{--oc:#1b8f2f}.ost.p{--oc:#d6246e}.ost.w{--oc:#141414}
@keyframes ostP{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--oc) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.ost .ot i{animation:none}}
#sheets .sheet:not(:last-child){visibility:hidden}
.brandl{display:flex;align-items:center;gap:10px;min-width:0}
.brandl .logo{flex:0 1 auto;min-width:0}
.brandl .logo small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admbtn{width:38px;height:38px;flex:0 0 auto}
.admbtn .dot{background:var(--warm)}
.adm{padding-bottom:110px}
.admtabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:14px;margin:6px 0 14px}
.admtabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
.admtabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.admsec{margin-bottom:18px}
.admsec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.admrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:12px 14px;border-radius:12px;margin-bottom:6px}
.admrow input[type=number]{width:110px;text-align:right}
.adm input:not([type=checkbox]),.adm textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:15px}
.adm textarea{width:100%;resize:vertical}
.admfld{display:flex;flex-direction:column;gap:4px;padding:0 14px 10px;background:var(--surface);margin:-8px 0 6px;border-radius:0 0 12px 12px}
.admfld small{color:var(--muted);font-size:12px}
.admfld input{width:100%}
.admban .admrow{margin-bottom:6px}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:.2s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw.small{width:38px;height:24px}.sw.small i::after{width:18px;height:18px}.sw.small input:checked+i::after{transform:translateX(14px)}
.admhint{color:var(--muted);font-size:13px;margin:6px 2px 10px}
.admline{width:100%;text-align:left}
.admline .chev{color:var(--muted);font-size:22px}
.admtag{font-size:11px;background:var(--warm);color:#fff;padding:1px 6px;border-radius:6px;vertical-align:middle}
.admphoto{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.admphoto .th{width:84px;height:84px;border-radius:14px;object-fit:contain;background:#fff}
.admphoto>div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pill{padding:8px 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;text-decoration:none;display:inline-block}
.pill.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pill.warn{background:#a3001a}.pill.sel{outline:2px solid var(--ink);outline-offset:2px}
.admit{gap:8px}.admit.off .t1{opacity:.45;text-decoration:line-through}
.admprice{width:86px;text-align:right}
.admic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font-size:16px}
.admic.on{background:var(--accent);}
.admsave{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:560px;margin:0 auto}
.admsave span{flex:1;font-weight:700}
.admsave .ghost{color:var(--bg);opacity:.75;padding:8px 10px}
.admsave .go{background:var(--ok);color:#fff;font-weight:800;padding:10px 16px;border-radius:12px}
.ordtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.ofil{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.ofil button{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--surface);font-weight:700;font-size:13px}
.ofil button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ofil small{opacity:.6;font-weight:600}
.ordsum{color:var(--muted);font-size:13px;margin:4px 2px 10px}
.ord{background:var(--surface);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ordh{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:12px 14px;align-items:center}
.ordh b{font-family:var(--f-display)}
.ost2{grid-column:2/4;justify-self:start;font-size:12px;font-weight:700;color:var(--c)}
/* запрет копирования: без выделения текста, перетаскивания картинок и меню «сохранить/копировать» (поля ввода — как обычно) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
img{pointer-events:none}   /* долгое нажатие на картинку не вызывает меню «Скачать» (Android/Telegram) — нажатие уходит на карточку */
/* профиль покупателя */
.osum{grid-row:1/3;grid-column:3;font-weight:700;font-variant-numeric:tabular-nums}
.obody{padding:0 14px 14px}
.coins{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}
.coins b{font-family:var(--f-display);font-size:22px}
.coins small{grid-column:1/3;color:var(--muted);font-size:12.5px}
.refhello{background:linear-gradient(120deg,#FFD9E8,#DDEEFF 60%,#EDE2FF);color:#141414;border-radius:18px;padding:18px;margin:8px 0}
.rh1{font-family:Pangolin,var(--f-display);font-size:26px;line-height:1.1}
.refhello p{margin:8px 0;font-size:14.5px;line-height:1.4}
.refhello ul{margin:0 0 14px;padding-left:18px;font-size:14px;line-height:1.55}
.refgo{min-height:46px;padding:0 18px;border-radius:13px;background:#141414;color:#fff;font-weight:700;width:100%}
.flip{perspective:1100px;margin:10px auto 2px;max-width:420px;cursor:pointer}
.flipin{position:relative;aspect-ratio:1243/714;transform-style:preserve-3d;animation:cardwob 6s ease-in-out infinite}   /* слой 1: покачивание — всегда */
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.34,1.32,.5,1)}       /* слой 2: переворот */
.flipin.flipped .card3d{transform:rotateY(180deg)}
.card3d img{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 34px rgba(0,0,0,.35);object-fit:cover}
.card3d .cardbk{transform:rotateY(180deg)}
.flipin.flipping{animation-play-state:paused}
@keyframes cardwob{0%,100%{transform:rotateY(-14deg) rotateX(4deg)}50%{transform:rotateY(14deg) rotateX(-3deg)}}
@keyframes cardlift{0%,100%{scale:1;translate:0 0 0}45%{scale:1.07;translate:0 -6px 40px}}   /* отдельные свойства — не мешают повороту */
.flipin.lift .card3d{animation:cardlift 1.15s ease-in-out}
.flipbar{height:3px;border-radius:2px;background:var(--line);margin:8px auto 0;max-width:420px;overflow:hidden}
.flipbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.flipbar.run i{animation:flipt 20s linear forwards}
@keyframes flipt{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.flipin,.flipin.lift .card3d{animation:none}.card3d{transition:none}}
.center{text-align:center}
.reflink{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;margin:10px 0}
.reflink code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.reflink button{min-height:36px;padding:0 12px;border-radius:9px;background:var(--line);font-weight:700;color:var(--ink)}
.refstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.refstats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.refstats b{display:block;font-family:var(--f-display);font-size:19px}
.refstats span{font-size:11.5px;color:var(--muted)}
.printrow{display:flex;gap:10px;align-items:center}
.printrow .refgo{flex:1;width:auto}
.coinpay{display:flex;gap:10px;align-items:flex-start;margin:6px 0;padding:12px 14px;border-radius:14px;background:#FFF1D6;color:#3D2A00;border:1px solid #F3C66B;font-weight:600;font-size:14px}
.coinpay input{width:20px;height:20px;margin-top:1px;flex:none}
.coinpay small{display:block;font-weight:500;opacity:.8;font-size:12.5px;margin-top:2px}
.total.pay strong{color:#1b8f2f}
.mytot.sub{border-top:0;padding-top:0;margin-top:4px;color:var(--muted);font-size:14px}
.myi.hist b{font-variant-numeric:tabular-nums}
.myi b.plus{color:#1b8f2f}
.coinform{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin:10px 0}
.coinform input{min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;font-size:14px}
.coinform button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink,#fff);font-weight:700}
.myord{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}
.myh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.myh b{font-size:16px}
.mym{color:var(--muted);font-size:13px;margin-top:4px}
.myi{margin-top:10px;display:grid;gap:6px;font-size:14px}
.myi div{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline}
.myi span:nth-child(2){color:var(--muted)}
.mytot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.paychip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--muted);margin-top:8px}
.paychip.ok{background:rgba(27,143,47,.16);color:#1b8f2f}
.track{list-style:none;margin:12px 0 2px;padding:0;display:grid;gap:0}
.track li{position:relative;padding:0 0 12px 26px;font-size:14px;color:var(--muted)}
.track li:last-child{padding-bottom:0}
.track li::before{content:"";position:absolute;left:4px;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-sizing:border-box}
.track li::after{content:"";position:absolute;left:9px;top:17px;bottom:-1px;width:2px;background:var(--line)}
.track li:last-child::after{display:none}
.track li.on{color:var(--ink);font-weight:600}
.track li.on::before{background:#1b8f2f;border-color:#1b8f2f}
.track li.on::after{background:#1b8f2f}
.track li.now::before{box-shadow:0 0 0 4px rgba(27,143,47,.22)}
.ordbatch{grid-column:2/4;font-size:12px;color:var(--muted)}
.admhint.small{font-size:12px;margin-top:8px}
.mybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mybtns button{min-height:44px;border-radius:12px;font-weight:700;background:var(--line);color:var(--ink)}
.mybtns button:first-child{background:var(--accent);color:var(--accent-ink,#fff)}
.mybtns button.armed{background:#a3001a;color:#fff}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px;padding:10px 14px;border-radius:14px;background:#E8EDFF;color:#1d2a7a;font-weight:600;font-size:14px}
.editbar button{color:inherit;text-decoration:underline;font-weight:600;min-height:32px}
.ordw{grid-column:1/3;font-weight:700}.ordw small{color:var(--muted);font-weight:500}
.ordm{grid-column:1/3;color:var(--muted);font-size:12px}
.ords{grid-column:3;grid-row:3/5;font-family:var(--f-display);font-weight:600}
.ordb{border-top:1px solid var(--line);padding:10px 14px 14px}
.ordi{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:13px;padding:4px 0}
.ordi span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.ordc{margin-top:8px;font-size:13px}
.ordact{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.empty.small{padding:18px;font-size:14px}
.banner.ink{background:#11131B;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.banner.cobalt{background:#2747EE}.banner.coral{background:#E5533B}
.banner.mint{background:#14876A}.banner.amber{background:#F3B23A;color:#1A1405}
.banner .deco{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:22px solid rgba(255,255,255,.12)}
.banner .deco2{position:absolute;right:30px;top:58px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14)}
.logo-b{justify-content:center;align-items:flex-start}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:58px;line-height:.9;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wordmark i{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:#7088FF;box-shadow:.32em -.2em 0 -.08em rgba(255,255,255,.35),.62em -.42em 0 -.13em rgba(255,255,255,.2)}
.logo-b .p{opacity:.7}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots span{width:6px;height:6px;border-radius:3px;background:rgba(17,19,27,.18);transition:width .25s}
.dots span.on{width:18px;background:#141414}
/* главная: категории и бренды */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.cat .tile{aspect-ratio:1/0.62}
.cat .body{padding:10px 12px 12px}
.cat .name{font-weight:800;font-size:15px}
.cat .meta{color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.brands{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-block:2px 6px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));cursor:grab}
.brands::-webkit-scrollbar{display:none}
.brand{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand .av{width:64px;height:64px;border-radius:50%;background:var(--photo-bg);border:2px solid var(--line);overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink)}
.brand .av img{width:86%;height:86%;object-fit:contain}
.brand .av.all{background:var(--surface);font-size:13px}
.brand .bn{font-size:12px;font-weight:700;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand .bc{font-size:11px;color:var(--muted);font-weight:600;margin-top:-4px}
.brand[aria-pressed="true"] .av{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.brand[aria-pressed="true"] .bn{color:var(--accent)}
.more{display:block;width:100%;margin-top:14px;height:46px;border-radius:var(--r-s);background:var(--surface);font-weight:700}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}

/* item rows */
.rows{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .t1{font-weight:600;line-height:1.3}
.row .t2{color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.row .t3{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:3px;font-style:italic}
.ldesc{margin:10px 0 2px;color:var(--ink);opacity:.82;font-size:14px;line-height:1.5;max-width:60ch}
.row.off .t1,.row.off .pr{color:var(--muted)}
.na{flex:none;width:36px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.seg button small{font-size:12px;font-weight:600;opacity:.65;margin-left:5px}
.row .pr{font-family:var(--f-display);font-weight:500;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grouph{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:18px 4px 8px}

.add{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:600;display:grid;place-items:center;line-height:1}
.step{flex:none;display:flex;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:18px;height:36px}
.step button{width:34px;height:36px;font-size:20px;font-weight:700;color:inherit;line-height:1}
.step span{min-width:18px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:transparent;overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.sheet .inner{max-width:560px;margin:0 auto;padding-bottom:120px}
.shead{position:sticky;top:0;z-index:2;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;padding-block:10px}
.clearcart{flex:none;height:36px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.clearcart.armed{color:#fff;background:#D93A2B;border-color:#D93A2B}
.shead .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
/* вторая кнопка «назад» — внизу, под большой палец */

  background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.28)}

.fback[hidden]{display:none}
body.barup .fback{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.totop{position:fixed;z-index:35;right:max(14px,calc(50% - 266px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.totop svg{width:22px;height:22px}
.totop[hidden]{display:none}
body.barup .totop{bottom:calc(86px + env(safe-area-inset-bottom,0px))}

.sheet::after{content:"";display:block;height:76px}
.hero{border-radius:var(--r);aspect-ratio:2/1;max-width:100%}
.hero .mono{font-size:64px;left:18px;bottom:10px}
.hero .mono.long{font-size:48px}

.facts .src{color:var(--muted)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

/* cart */
.ci .t2 b{color:var(--ink);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 4px}
.total span{color:var(--muted);font-weight:600}
.prenote{display:flex;gap:12px;align-items:flex-start;margin:4px 0 6px;padding:14px;border-radius:14px;background:#FFF1D6;color:#3D2A00;border:1px solid #F3C66B}
.prenote svg{width:22px;height:22px;flex:none;color:#C27A00;margin-top:1px}
.prenote b{display:block;font-weight:800;font-size:15px;margin-bottom:2px}
.prenote span{font-size:13.5px;line-height:1.4}
.glybox{display:flex;flex-direction:column;gap:3px;margin-top:10px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);font-size:13px;color:var(--muted);line-height:1.4}
.bottles{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.bottles span{flex-basis:100%;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bottles button{flex:1;min-width:0;height:34px;padding:0 6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink)}
.bottles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.glybox .weak{color:#C27A00;font-weight:600}
.glybox > b{color:var(--ink);font-size:14px;font-weight:800}
.glybox span b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;max-width:min(92vw,520px);padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.booster{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--accent)}
.booster .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.booster b{font-weight:800}
.booster .txt span{font-size:12.5px;color:var(--muted)}
.booster .txt span.need{color:var(--accent);font-weight:700}
.bplus{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px}
.whbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.whbar b{font-weight:800;font-size:15px;color:var(--accent)}
.whbar span{font-size:13px;color:var(--muted);font-weight:600}
.whhead{margin:18px 0 6px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:inline-block}
.whcart{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 8px}
.whcart b{font-weight:800;font-size:15px}
.whcart span{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.minbar{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
.minbar .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.minbar .track i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.minbar span{font-size:13px;font-weight:600;color:var(--muted)}
.minbar.ok span{color:var(--ink)}
.total strong{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.field{display:block;margin-top:10px}
.field textarea,.field input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:12px;outline:none;resize:vertical;min-height:46px}
.note{color:var(--muted);font-size:13px;margin-top:12px}
.done{text-align:center;padding:60px 8px 20px}
.done .big{font-family:var(--f-display);font-weight:700;font-size:26px;margin:16px 0 8px}
.check{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.check svg{width:36px;height:36px}
pre.payload{text-align:left;background:var(--surface);border-radius:var(--r-s);padding:12px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;color:var(--muted)}

/* bottom bar (outside Telegram) */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cartbar .inbar{max-width:560px;margin:0 auto}
.cta{width:100%;height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 6px 20px var(--shade)}
.cta span{font-variant-numeric:tabular-nums;flex:none}
.cta{gap:10px}
.cta .hint{flex:1;min-width:0;text-align:center;font-size:12.5px;font-weight:600;line-height:1.2;opacity:.85}
.cta.short{background:var(--warm);color:#fff}
.cta.enough{background:var(--ok);color:#fff}
.cta[disabled].short{opacity:.85}
.minbar .track i{background:var(--warm)}
.minbar.ok .track i{background:var(--ok)}
.cta.center{justify-content:center}
.cta[disabled]{opacity:.5}
.mock{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
/* широкий экран (комп во весь экран): каталог в 4 колонки */
@media (min-width:900px){
  .app{max-width:980px}
  .app .grid, .app .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
}

.uc{padding:12px 14px}

.ordi.bm{width:100%;text-align:left;background:none;border:0;color:inherit;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--line)}
.admA{padding-bottom:150px}

.admnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;color:var(--muted);font-size:12px;font-weight:700}

.todob{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;margin:4px 0 12px}
.tbh{display:flex;align-items:baseline;gap:8px}.tbh b{font-size:18px;font-weight:800}.tbh span{font-size:13px;color:var(--accent);font-weight:700}
.tbs{display:flex;align-items:center;gap:8px;font-size:14px}.tbs i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.tbs i.on{background:#35c26b}
.tbn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tbn div{background:var(--bg);border-radius:14px;padding:10px 12px}
.tbn small{display:block;font-size:12px;color:var(--muted)}.tbn b{font-size:18px;font-weight:800}
.tbgo{height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px}
.todol{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.todoi{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.todol .todoi:last-child{border-bottom:0}
.todoi.wide{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;font-weight:700}
.todoi .tn{min-width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent)}

.sgrp{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.sgh{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}

.uc .ubtn{width:100%;text-align:left;background:none;padding:0}

<script>
(()=>{
// внутри Telegram: platform != unknown (при открытии кнопкой «🛒 Магазин» initData пустой — это нормально)
const TGW = window.Telegram && window.Telegram.WebApp;
const TG = TGW && (TGW.initData || (TGW.platform && TGW.platform !== 'unknown')) ? TGW : null;
// заказ боту можно отправить, только если магазин открыт кнопкой «🛒 Магазин» внизу чата (тогда initData пустой)
const CAN_SEND = !!TG && !TG.initData;
const OPEN_HINT = 'Чтобы оформить заказ, открой магазин кнопкой «🛒 Магазин» внизу чата с ботом';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => n.toLocaleString('ru-RU').replace(/\s/g,' ') + ' ₽';
const norm = s => s.toLowerCase().replace(/ё/g,'е');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); };
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const hap = t => { try { TG && TG.HapticFeedback.impactOccurred(t || 'light'); } catch(e){} };

const IND_DEF = { ind_min1: 10000, ind_min2: 4000, ind_profit: 5000, ind_ship: 700, ref_join: 150, ref_pct: 5, ref_cap: 15 };   // индивидуальный заказ (вне сбора)
const indCfg = k => +((S && S[k]) || IND_DEF[k]);
let MIN_ORDER = 2500;   // минимальная сумма заказа, ₽ (бот проверяет то же самое; админ может поменять)
let C, ITEMS = {}, LINES = {}, RAW_CATALOG = null, ADM_LINES = {}, CATNAME = {};
let S = {};              // настройки админа: settings.json (свои цены, скрытые позиции, фото, баннеры, минималка)
let state = { cat: 'home', brand: null, q: '', sort: 'name', shown: 40, view: [], wh: store.get('klsd.wh', 0) };
let cart = store.get('klsd.cart', {});           // "itemId|var" -> qty
const PICKUP = false;   // самовывоза пока нет — продавец развозит сам. Появится склад — поставить true, вернётся выбор «Самовывоз / Доставка»
let delivery = PICKUP ? store.get('klsd.delivery', 'pickup') : 'courier';

function split(name){ // "Apple Mint /// Яблоко Мята" -> ["Яблоко Мята","Apple Mint"]
  const p = name.split('///').map(s => s.trim()).filter(Boolean);
  return p.length > 1 ? [p.slice(1).join(' / '), p[0]] : [name, ''];
}
function hue(s){ let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360; }
function mono(t){
  const w = t.replace(/[()«»"]/g,' ').split(/[\s\-_/.&]+/).filter(x => /[A-Za-zА-Яа-яЁё0-9]/.test(x));
  let m = (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2));
  return m.toUpperCase();
}
function tile(l, cls){
  const strengths = l.vars.length && !['food','tob','pods'].includes(l.cat) ? [l.vars.join(' / ')] : [];
  const tags = [...l.info.slice(0, 2), ...strengths].slice(0, 2);
  const tagHtml = tags.length ? `<div class="tag">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : '';
  if (l.img != null && C.imgs) return `<div class="tile photo ${cls||''}"><img src="${C.imgs[l.img]}" alt="" loading="lazy" decoding="async">${tagHtml}</div>`;
  const m = mono(l.t);
  return `<div class="tile ${cls||''}" style="--h:${hue(l.t)}"><div class="ring"></div>
    ${tags.length ? `<div class="tag">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="mono ${m.length > 2 ? 'long' : ''}">${esc(m)}</div></div>`;
}
function lineMin(l){ return Math.min(...l.items.map(i => i[2])); }
function lineCount(l){ let n = 0; for (const it of l.items) for (let v = 0; v < Math.max(1, l.vars.length); v++) n += cart[it[0] + '|' + v] || 0; return n; }
function unitWord(l){ if (l.id === 'glycerin') return ['позиция','позиции','позиций']; return ({salt:['вкус','вкуса','вкусов'],free:['вкус','вкуса','вкусов'],diy:['вкус','вкуса','вкусов'],disp:['вкус','вкуса','вкусов'],snus:['вкус','вкуса','вкусов']}[l.cat]) || ['позиция','позиции','позиций']; }

function applySettings(){
  ADM_LINES = {}; CATNAME = {};
  const hide = S.hide || {}, price = S.price || {};
  for (const c of C.cats){ CATNAME[c.id] = c.t;
    c.lines = c.lines.filter(l => {
      const lp = (S.lphoto || {})[l.id]; if (lp){ C.imgs.push(lp); l.img = C.imgs.length - 1; }
      for (const it of l.items){ const ip = (S.iphoto || {})[it[0]]; if (ip){ C.imgs.push(ip); it[5] = C.imgs.length - 1; }
        if (price[it[0]]){ it._p = it[2]; it[2] = price[it[0]]; } }
      ADM_LINES[l.id] = { l, items: l.items.slice(), cat: c.id, hidden: !!hide['L:' + l.id] };
      l.items = l.items.filter(it => !hide[it[0]]);
      return !hide['L:' + l.id] && l.items.length;
    });
  }
  if (S.min_order) MIN_ORDER = +S.min_order;
}
function init(data, again){
  if (!again) RAW_CATALOG = data;
  C = Object.assign({}, data, { cats: JSON.parse(JSON.stringify(data.cats)), imgs: (data.imgs || []).slice() });
  ITEMS = {}; LINES = {};
  applySettings();
  for (const c of C.cats) for (const l of c.lines){ l.cat = c.id; LINES[l.id] = l; l._multi = new Set(l.items.map(i => i[5])).size > 1; for (const it of l.items.concat(l.hid || [])) ITEMS[it[0]] = { it, l }; }
  for (const k of Object.keys(cart)){ const [id, v] = k.split('|'); if (!ITEMS[id] || !has(ITEMS[id].it, +v)) delete cart[k]; }   // ушедшие позиции
  $('#ver').textContent = 'наличие на ' + (C.v || '—') + ' · ' + plural(Object.keys(ITEMS).length, 'позиция','позиции','позиций');
  state.cat = 'home';
  if (TG && !again){ document.documentElement.classList.add('tg'); TG.ready(); TG.expand();
    // на компе — сразу во весь экран (мини-приложение открывается маленьким окном). На телефоне не трогаем.
    if (['tdesktop', 'macos'].includes(TG.platform) && TG.isVersionAtLeast && TG.isVersionAtLeast('8.0') && TG.requestFullscreen){
      const fs = () => document.documentElement.classList.toggle('fs', !!TG.isFullscreen);
      try { TG.onEvent('fullscreenChanged', fs); TG.requestFullscreen(); } catch (e) {}
    }
    TG.BackButton.onClick(() => closeSheet()); TG.MainButton.onClick(() => onCta()); }
  if (!again && IS_ADMIN && !$('#admBtn')){ const h = $('#home'), w = document.createElement('div'); w.className = 'brandl'; h.before(w); w.append(h); w.insertAdjacentHTML('beforeend', admBtnHtml());
    $('#admBtn').addEventListener('click', () => { if (topKind() !== 'admin') openSheet('admin'); }); admDot(); }
  if (!again) loadMy();   // профиль: свои заказы (для проверки «один заказ за сбор» и значка на кнопке)
  renderRail(); renderMain(); renderCart();
}

function renderRail(){
  $('#rail').innerHTML = `<button class="chip" data-cat="home" aria-pressed="${state.cat === 'home' && !state.q}">Главная</button>` + C.cats.map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id === state.cat && !state.q}">${esc(c.t)} <b>${c.lines.reduce((a, l) => a + l.items.length, 0)}</b></button>`).join('');
  const on = $('#rail [aria-pressed="true"]'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
// ряд категорий: колесо мыши листает вбок, можно тянуть мышкой (Telegram на компьютере)
(() => { const r = $('#rail'); let down = false, sx = 0, sl = 0, moved = false;
  r.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && r.scrollWidth > r.clientWidth){ r.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  r.addEventListener('mousedown', e => { down = true; moved = false; sx = e.pageX; sl = r.scrollLeft; });
  window.addEventListener('mousemove', e => { if (!down) return; const dx = e.pageX - sx; if (Math.abs(dx) > 4){ moved = true; r.scrollLeft = sl - dx; } });
  window.addEventListener('mouseup', () => { down = false; });
  r.addEventListener('click', e => { if (moved){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);
})();
$('#rail').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  goCat(b.dataset.cat, null);
});
function goCat(cat, brand){
  state.cat = cat; state.brand = brand; state.shown = 40;
  if (state.q){ state.q = ''; $('#q').value = ''; $('#qClear').hidden = true; }
  renderRail(); renderMain(); window.scrollTo({ top: 0 });
}
$('#home').addEventListener('click', () => goCat('home', null));
// перетаскивание мышкой и колесо для любых горизонтальных лент
function dragScroll(r){ let down = false, sx = 0, sl = 0, moved = false;
  r.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && r.scrollWidth > r.clientWidth){ r.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  r.addEventListener('mousedown', e => { down = true; moved = false; sx = e.pageX; sl = r.scrollLeft; r.style.scrollSnapType = 'none'; });
  window.addEventListener('mousemove', e => { if (!down) return; const dx = e.pageX - sx; if (Math.abs(dx) > 4){ moved = true; r.scrollLeft = sl - dx; } });
  window.addEventListener('mouseup', () => { if (!down) return; down = false; r.style.scrollSnapType = '';
    if (r._snap) r._snap(); });
  r.addEventListener('click', e => { if (moved){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);
}

/* статус заказа по расписанию: 1-я/3-я пятница 10:00 — старт, ближайший понедельник 19:00 — закрытие,
   +5…6 дней — сортировка, +7 — заказ у покупателя (примерно) */
function orderCycles(y, m){
  const first = new Date(y, m, 1), fri1 = 1 + ((5 - first.getDay() + 7) % 7);
  // закрытие — ближайший понедельник после пятницы старта (через 3 дня)
  return [[fri1, fri1 + 3], [fri1 + 14, fri1 + 17]].map(([f, mo]) => ({
    start: new Date(y, m, f, 10), close: new Date(y, m, mo, 19), sort: new Date(y, m, mo + 5), sortEnd: new Date(y, m, mo + 7), arrive: new Date(y, m, mo + 7), arriveEnd: new Date(y, m, mo + 8) }));
}
function cycOvr(){   // ручной сбор из админки (S.cyc = [начало, конец] в секундах); в демо — из несохранённого
  const v = (PEND && PEND.cyc !== undefined && DEMO) ? PEND.cyc : (S && S.cyc);
  return Array.isArray(v) && v.length === 2 && v[1] > v[0] ? v : null; }
function mkCycle(start, close){ const d = (n, h) => new Date(close.getFullYear(), close.getMonth(), close.getDate() + n, h || 0);
  return { start, close, sort: d(5), sortEnd: d(7), arrive: d(7), arriveEnd: d(8), manual: true }; }
function allCycles(now = new Date(), span = [-1, 0, 1]){   // плановые сборы + ручной (заменяет плановый, с которым пересекается)
  let cs = span.flatMap(k => orderCycles(now.getFullYear(), now.getMonth() + k));
  const o = cycOvr();
  if (o){ const a = new Date(o[0] * 1000), b = new Date(o[1] * 1000);
    cs = cs.filter(c => !(c.start < b && a < c.close)).concat(mkCycle(a, b)).sort((x, y) => x.start - y.start); }
  return cs; }
const hm = d => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const wd = d => ['в воскресенье', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу'][d.getDay()];
function orderPhase(now = new Date()){
  const cs = allCycles(now);
  const dm = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const open = cs.find(c => now >= c.start && now < c.close);
  if (open) return { cls: 'r', title: 'Приём заявок открыт', lbl: 'до закрытия', to: open.close, sub: 'закрываем ' + wd(open.close) + ' ' + dm(open.close) + ' в ' + hm(open.close) };
  const nx = cs.find(c => c.start > now);
  const ph = { cls: 'w', title: 'Ждём старт заказа', lbl: 'до старта', to: nx.start, sub: 'старт ' + wd(nx.start) + ' ' + dm(nx.start) + ' в ' + hm(nx.start) };
  // что сейчас с прошлым (уже закрытым) заказом: этап, который поставил продавец, — или примерно по датам
  const last = cs.filter(c => c.close <= now).pop(), stg = last && batchStage(last);
  // этап сбора от продавца — заголовком баннера (вместо «Ждём старт заказа»), таймер до следующего старта остаётся
  const BT = { supplier: ['y', 'Заказ у поставщика'], transit: ['y', 'Заказ в пути'], sorting: ['g', 'Заказ на сортировке'], ready: ['p', 'Заказ готов к получению'] };
  if (stg && BT[stg] && now - last.close < 21 * 864e5){ Object.assign(ph, { cls: BT[stg][0], title: BT[stg][1] }); return ph; }
  const cur = cs.find(c => now >= c.close && now < c.arriveEnd);
  if (cur){
    if (now < cur.sort) Object.assign(ph, { batch: 'y', bt: 'прошлый заказ у поставщика · сортировка примерно ' + dm(cur.sort) });
    else if (now < cur.arrive) Object.assign(ph, { batch: 'g', bt: 'прошлый заказ на сортировке · у тебя примерно ' + dm(cur.arrive) });
    else Object.assign(ph, { batch: 'p', bt: 'прошлый заказ у тебя — примерно сегодня' });
  }
  return ph;
}
function cdText(ms){ if (ms <= 0) return 'вот-вот';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p2 = n => String(n).padStart(2, '0');
  return (d ? d + ' д ' : '') + p2(h) + ':' + p2(m) + ':' + p2(sec); }
function statusHtml(){ const ph = orderPhase();
  return `<div class="ost ${ph.cls}"><div class="ok">Статус заказа</div><div class="ot"><i></i>${esc(ph.title)}</div>
    ${ph.to ? `<div class="ol">${esc(ph.lbl)}</div><div class="oc" id="ostCd">${cdText(ph.to - Date.now())}</div>` : ''}<div class="os">${esc(ph.sub)}</div></div>`; }
let ostTimer;
function tickStatus(){ clearInterval(ostTimer); const p0 = orderPhase(); let phase = p0.title + (p0.bt || '');
  ostTimer = setInterval(() => { const el = document.getElementById('ostCd'), box = document.querySelector('.banner.status');
    if (!box){ clearInterval(ostTimer); return; }
    const ph = orderPhase();
    if (ph.title + (ph.bt || '') !== phase){ phase = ph.title + (ph.bt || ''); box.innerHTML = statusHtml(); return; }
    if (el && ph.to) el.textContent = cdText(ph.to - Date.now()); }, 1000); }
function calHtml(d = new Date()){
  const y = d.getFullYear(), m = d.getMonth(), today = d.getDate();
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;                 // понедельник — первый
  // все циклы, чьи даты попадают в этот месяц (и хвост прошлого месяца)
  const inM = dd => dd.getFullYear() === y && dd.getMonth() === m ? dd.getDate() : null;
  const cyc = allCycles(new Date(y, m, 15), [-1, 0]);
  const set = f => new Set(cyc.map(f).map(inM).filter(Boolean));
  const HOT = set(c => c.start), GOLD = set(c => c.close), PINK = set(c => c.arrive);
  const SORT = new Set([...set(c => c.sort), ...set(c => new Date(c.sort.getFullYear(), c.sort.getMonth(), c.sort.getDate() + 1))]);
  const SORT0 = set(c => c.sort);
  const mon = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'][m];
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<i></i>';
  for (let n = 1; n <= days; n++){

function renderSearch(m){

const BOTTLES = [30, 60, 90, 120];
const BOOSTER = '1cbf671';   // Salt бустер (20 мг/30 мл)
// бустер нужен только солевым конструкторам в банке на 30 мл: по одному на банку
function boosterNeed(){ let n = 0;
  for (const [k, links] of Object.entries(glyLinks)){ const x = ITEMS[k.split('|')[0]];
    if (cart[k] && x && x.l.gly && x.l.gly.nic === 'salt') for (const l of links) if ((Array.isArray(l[0]) ? l[1] : l[2] || 30) === 30) n++; }
  return n; }
let bottleSel = store.get('klsd.bottles', {});          // линейка -> выбранная банка
let glyLinks = store.get('klsd.glylinks', {});          // ключ аромки -> [[ключ глицерина, шт], ...] по одной на каждую аромку
function glyPlan(l){
  const g = l.gly, T = g.t,   // банка — та, в которой конструктор приходит от поставщика
    z = T - Math.round(T * 2 / 30), need = z - g.a;
  // родной глицерин целыми флаконами; если сильно не хватает — доливаем универсальным
  let best = null;
  const tryPlan = parts => { const vol = parts.reduce((a, p) => a + p.ml * p.n, 0), cnt = parts.reduce((a, p) => a + p.n, 0);
    const sc = [Math.abs(vol - need) + (vol > need ? 0.5 : 0) + (parts.length > 1 ? 0.3 : 0), cnt];
    if (!best || sc[0] < best.sc[0] || (sc[0] === best.sc[0] && sc[1] < best.sc[1])) best = { parts, vol, sc }; };
  for (const [id, ml] of (g.c || [[g.id, g.ml]])){ if (!ITEMS[id]) continue;
    for (const n of [Math.floor(need / ml), Math.round(need / ml), Math.ceil(need / ml)]) { if (n < 1) continue;
      tryPlan([{ id, ml, n }]);
      const rest = need - n * ml;
      for (const [did, dml] of (g.d || [])) if (ITEMS[did] && did !== id && rest >= dml * 0.6){
        const k = Math.max(1, Math.round(rest / dml)); tryPlan([{ id, ml, n }, { id: did, ml: dml, n: k }]); } } }
  if (!best) return null;
  return { parts: best.parts, id: best.parts[0].id, ml: best.parts[0].ml, n: best.parts[0].n, a: g.a, t: T, z,
    got: Math.min(z, g.a + best.vol), left: Math.max(0, g.a + best.vol - z), base: g.t };
}
function glyName(g){ return split(ITEMS[g.id].it[1]).filter(Boolean).pop().replace(/\s*-\s*Глицерин/i, ' глицерин').replace(/^Глицерин/, 'глицерин'); }
let toastT;
function toast(text){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
function act(b){
  const k = b.dataset.k;
  if (b.dataset.act === 'inc') cart[k] = (cart[k] || 0) + 1;
  if (b.dataset.act === 'dec'){ cart[k] = (cart[k] || 0) - 1; if (cart[k] <= 0) delete cart[k]; }
  if (b.dataset.act === 'del') delete cart[k];
  // конструктор: к каждой аромке сразу кладём глицерин (и убираем вместе с ней)
  const x = ITEMS[k.split('|')[0]];
  let glyChanged = false;
  if (x && x.l.gly && !ADDITIVE.test(x.it[1]) && (b.dataset.act === 'inc' || b.dataset.act === 'dec')){
    const links = glyLinks[k] || (glyLinks[k] = []);
    if (b.dataset.act === 'inc'){ const g = glyPlan(x.l);
      if (g){ const add = g.parts.map(p => [p.id + '|0', p.n]); add.forEach(([gk, n]) => cart[gk] = (cart[gk] || 0) + n);
        links.push([add, g.t]);
        toast(`+ ${g.parts.map(p => glyName(p) + (p.n > 1 ? ' × ' + p.n : '')).join(' + ')} — банка ${g.t} мл, выйдет ${g.got} мл нулевки`); } }
    else { const last = links.pop(); if (last){ const add = Array.isArray(last[0]) ? last[0] : [[last[0], last[1]]];
      add.forEach(([gk, n]) => { cart[gk] = (cart[gk] || 0) - n; if (cart[gk] <= 0) delete cart[gk]; }); } }
    if (!links.length) delete glyLinks[k];
    store.set('klsd.glylinks', glyLinks); glyChanged = true;
  } else if (x && x.l.kit && ITEMS[x.l.kit] && (b.dataset.act === 'inc' || b.dataset.act === 'dec')){
    // глицерин, который поставщик кладёт в комплект к аромке (0–1 ₽): отдельно не продаётся, добавляем сами
    const links = glyLinks[k] || (glyLinks[k] = []), gk = x.l.kit + '|0';
    if (b.dataset.act === 'inc'){ cart[gk] = (cart[gk] || 0) + 1; links.push([[[gk, 1]], 0]); toast('+ глицерин из комплекта'); }
    else { const last = links.pop(); if (last){ cart[gk] = (cart[gk] || 0) - 1; if (cart[gk] <= 0) delete cart[gk]; } }
    if (!links.length) delete glyLinks[k];
    store.set('klsd.glylinks', glyLinks); glyChanged = true;
  }
  hap(); store.set('klsd.cart', cart);
  const wrap = b.closest('.row');
  if (glyChanged) refreshSheets();
  else if (wrap && b.dataset.act !== 'del' && !wrap.classList.contains('ci')){
    const q = cart[k] || 0; const old = wrap.querySelector('.step,.add'); old.outerHTML = stepper(k, q);
  } else refreshSheets();
  renderCart();
}

let stack = [];
function openSheet(kind, arg, extra){

    const v = e.target.closest('[data-var]'); if (v){ el._var = +v.dataset.var; drawSheet(el); return; }
    if (e.target.closest('[data-clear]')){ clearCart(el); return; }
    const bt = e.target.closest('[data-bottle]'); if (bt){ const l = LINES[el.dataset.arg]; bottleSel[l.id] = +bt.dataset.bottle;
      if (bottleSel[l.id] === l.gly.t) delete bottleSel[l.id]; store.set('klsd.bottles', bottleSel); drawSheet(el); return; }
    const bb = e.target.closest('[data-boost]'); if (bb){ const bk = BOOSTER + '|0'; cart[bk] = (cart[bk] || 0) + +bb.dataset.boost;
      store.set('klsd.cart', cart); hap(); refreshSheets(); renderCart(); return; }
    const d = e.target.closest('[data-del]'); if (d){ delivery = d.dataset.del; store.set('klsd.delivery', delivery); drawSheet(el); return; }
    if (kind === 'me' && meEvent(e, el)) return;

function checkout(){

  if (t.s < MIN_ORDER) return;
  // компактно, чтобы влезть в лимит Telegram sendData (4096 байт): [id, вариант, кол-во]
  const payload = { v: C.v, i: rows.map(c => [c.it[0], c.v, c.q]), d: delivery, c: (store.get('klsd.comment', '') || '').slice(0, 300) };
  if (indReady()) payload.ind = 1;   // бот сам проверит, тянет ли это на отдельную закупку
  if (useCoins){ const c = coinsMax(t.s); if (c.max) payload.coins = c.max; }
  if (EDIT) payload.edit = EDIT;

    if (topKind() !== 'me') openSheet('me'); return; } }
  const json = JSON.stringify(payload);
  if (CAN_SEND){ hap('medium');
    // корзина пустеет, отправленное лежит в профиле (и на всякий случай — «вернуть прошлый набор»)

    cart = {}; store.set('klsd.cart', cart); store.set('klsd.comment', ''); stopEdit();
    TG.sendData(json); return; }   // Telegram закроет приложение, заказ придёт боту
  if (!DEMO){ toast(OPEN_HINT); return; }                       // корзина не теряется
  cart = {}; store.set('klsd.cart', cart); store.set('klsd.comment', ''); stopEdit();
  while (stack.length) { stack.pop().remove(); }
  openSheet('done', '', { _order: { n: t.n, s: t.s, json } });
}

async function unsealOrders(hexKey, b64){
  const raw = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0)), key = new Uint8Array(hexKey.match(/../g).map(h => parseInt(h, 16)));
  const nonce = raw.slice(0, 16), tag = raw.slice(16, 32), ct = raw.slice(32);
  const hk = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', hk, new Uint8Array([...nonce, ...ct]))).slice(0, 16);
  if (mac.some((b, i) => b !== tag[i])) throw new Error('ключ не подходит');
  const out = new Uint8Array(ct.length), blk = new Uint8Array(key.length + 20);
  blk.set(key); blk.set(nonce, key.length);
  for (let i = 0; i * 32 < ct.length; i++){
    blk[key.length + 16] = i >>> 24; blk[key.length + 17] = (i >>> 16) & 255; blk[key.length + 18] = (i >>> 8) & 255; blk[key.length + 19] = i & 255;
    const ks = new Uint8Array(await crypto.subtle.digest('SHA-256', blk));
    for (let j = 0; j < 32 && i * 32 + j < ct.length; j++) out[i * 32 + j] = ct[i * 32 + j] ^ ks[j];
  }
  return JSON.parse(new TextDecoder().decode(out));
}

function admInput(e){
  const a = e.target.closest('[data-adm]'); if (!a) return false;
  const kind = a.dataset.adm, tg = a.dataset.t;
  if (kind === 'aq'){ return false; }
  if (a.dataset.ocom){ const n = +a.dataset.ocom, o = ORD && ORD.orders.find(x => x.n === n);
    PEND.com = PEND.com || {};
    if (o && a.value === (o.c || '')) delete PEND.com[n]; else PEND.com[n] = a.value.slice(0, 600);
    savePend(); admDot();
    const bar = e.target.closest('.adm'); if (bar){ const old = bar.querySelector('.admsave'), nu = admSaveBar();
      if (old) old.outerHTML = nu || ''; else if (nu) bar.insertAdjacentHTML('beforeend', nu); }
    return true; }
  if (kind === 'cycs' || kind === 'cycc'){ const v = Math.floor(new Date(a.value).getTime() / 1000); if (!v) return true;
    const now = new Date(), cs = allCycles(now), cur = cs.find(c => now >= c.start && now < c.close) || cs.find(c => c.start > now);
    const pc = PEND.cyc && PEND.cyc.length ? PEND.cyc.slice() : [Math.floor(+cur.start / 1000), Math.floor(+cur.close / 1000)];
    pc[kind === 'cycs' ? 0 : 1] = v;
    if (pc[1] <= pc[0]){ toast('Конец должен быть позже начала'); return true; }
    PEND.cyc = pc; savePend(); admDot();
    const bar = e.target.closest('.adm'); if (bar){ const old = bar.querySelector('.admsave'), nu = admSaveBar();
      if (old) old.outerHTML = nu || ''; else if (nu) bar.insertAdjacentHTML('beforeend', nu); }
    return true; }
  if (kind === 'min'){ const v = parseInt(a.value, 10); if (v && v !== MIN_ORDER) PEND.min_order = v; else delete PEND.min_order; }
  else if (kind === 'ind'){ const v = parseInt(a.value, 10); PEND.ind = PEND.ind || {};
    if (v > 0 && v !== indCfg(tg)) PEND.ind[tg] = v; else delete PEND.ind[tg]; }
  else if (kind === 'price'){ const v = parseInt(a.value, 10), cur = (S.price || {})[tg];
    if ((v || null) === (cur || null)) delete PEND.price[tg]; else PEND.price[tg] = v || null; }
  else if (kind === 'hide'){ const cur = !!(S.hide || {})[tg]; if (a.checked === cur) delete PEND.hide[tg]; else PEND.hide[tg] = a.checked; }
  else if (kind === 'boff' || kind === 'btxt'){ const n = a.dataset.n, k = kind === 'boff' ? 'off' : a.dataset.k;
    const v = kind === 'boff' ? !a.checked : a.value, cur = ((S.banners || {})[n] || {})[k];
    const p = PEND.banners[n] || {};
    if ((v || '') === (cur || '') || (kind === 'boff' && !v && !cur)) delete p[k]; else p[k] = v;

    if (old) old.outerHTML = nu || ''; else if (nu) bar.insertAdjacentHTML('beforeend', nu); }
  if (kind === 'hide' || kind === 'boff') refreshSheets();
  return true;
}
function admPayload(){
  const p = { adm: 1 };
  if (Object.keys(PEND.price).length) p.price = PEND.price;
  if (Object.keys(PEND.hide).length) p.hide = PEND.hide;
  if (Object.keys(PEND.banners).length) p.banners = PEND.banners;
  if (PEND.min_order) p.min_order = PEND.min_order;
  if (PEND.cyc !== undefined) p.cyc = PEND.cyc;
  if (PEND.bst && PEND.bst.length) p.bst = PEND.bst;
  if (PEND.com && Object.keys(PEND.com).length) p.com = Object.entries(PEND.com).map(([n, c]) => [+n, c]);
  if (Object.keys(PEND.ind || {}).length) p.ind = PEND.ind;
  if ((PEND.coin || []).length) p.coin = PEND.coin;
  if (PEND.card) p.card = PEND.card;
  if (PEND.nophoto.length) p.nophoto = PEND.nophoto;
  if (PEND.photo.length) p.photo = PEND.photo;
  if (PEND.st.length) p.st = PEND.st;
  if ((PEND.paid || []).length) p.paid = PEND.paid;
  if ((PEND.ban || []).length) p.ban = PEND.ban;
  return p;
}
function admSave(){
  const p = admPayload(), json = JSON.stringify(p);

  if (!DEMO){ toast('Сохранить можно, только если магазин открыт кнопкой «🛒 Магазин» внизу чата с ботом'); return; }
  // демо: применяем на этом экране
  S = S || {};
  for (const [k, v] of Object.entries(p.price || {})){ S.price = S.price || {}; if (v) S.price[k] = v; else delete S.price[k]; }
  for (const [k, v] of Object.entries(p.hide || {})){ S.hide = S.hide || {}; if (v) S.hide[k] = 1; else delete S.hide[k]; }
  for (const [n, b] of Object.entries(p.banners || {})){ S.banners = S.banners || {}; S.banners[n] = Object.assign(S.banners[n] || {}, b); }
  if (p.min_order) S.min_order = p.min_order;
  if (p.cyc !== undefined){ if (p.cyc.length) S.cyc = p.cyc; else delete S.cyc; }
  if (p.bst && ORD) for (const [n, st] of p.bst){ const b = (ORD.batches || []).find(x => x.n === n); if (b){ b.st = st; if (b.k === 'common' && b.s) S.bst = { b: b.s, st }; }
    for (const o of ORD.orders) if (o.bn === n && !['cancelled', 'reserved', 'done'].includes(o.st) && FLOW.indexOf(o.st) < FLOW.indexOf(st)) o.st = st; }
  if (p.com && ORD) for (const [n, c] of p.com){ const o = ORD.orders.find(x => x.n === n); if (o) o.c = c; }
  Object.assign(S, p.ind || {});
  for (const t of p.nophoto || []) delete (S[t.startsWith('L:') ? 'lphoto' : 'iphoto'] || {})[t.replace(/^L:/, '')];
  if (ORD) for (const [n, st] of p.st || []){ const o = ORD.orders.find(x => x.n === n); if (o) o.st = st; }
  if (ORD) for (const [n, v] of p.paid || []){ const o = ORD.orders.find(x => x.n === n); if (o) o.pd = v; }
  if (ORD) for (const [n, v] of p.ban || []){ const u = (ORD.users || []).find(x => x.id === n); if (u) u.st = v ? 'banned' : 'approved'; }
  const photos = p.photo ? p.photo.length : 0;
  PEND = { price: {}, hide: {}, banners: {}, nophoto: [], photo: [], st: [], paid: [], ban: [] }; savePend();
  init(RAW_CATALOG, true); refreshSheets(); admDot();
  toast('Демо: применено на этом экране' + (photos ? `. В Telegram бот попросил бы ${plural(photos, 'фото', 'фото', 'фото')}` : '') + '.');
}

window.__klsd = { unsealOrders, get S(){ return S; }, get min(){ return MIN_ORDER; }, closeAll(){ while (stack.length) closeSheet(); } };   // для проверок

const boot = c => (window.__SETTINGS ? Promise.resolve(window.__SETTINGS)
  : fetch('settings.json?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})))
  .then(st => { S = st || {}; init(c); });
if (window.__CATALOG) boot(window.__CATALOG);
else fetch('catalog.json', { cache: 'no-cache' }).then(r => r.json()).then(boot).catch(() => { $('#main').innerHTML = '<div class="empty">Не удалось загрузить каталог. Закройте и откройте магазин ещё раз.</div>'; });
})();
